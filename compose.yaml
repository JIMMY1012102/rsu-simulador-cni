services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rsu-oficial-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - rsu-vendor:/var/www/html/vendor
      - rsu-build:/var/www/html/public/build
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rsu-network

  web:
    image: nginx:stable-alpine
    container_name: rsu-oficial-web
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www/html

      - rsu-build:/var/www/html/public/build:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - rsu-network

  db:
    image: mariadb:11.4
    container_name: rsu-oficial-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: rsu_cni
      MARIADB_USER: rsu_user
      MARIADB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Configura DB_ROOT_PASSWORD en .env}
    volumes:
      - rsu-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - rsu-network

networks:
  rsu-network:
    driver: bridge

volumes:
  rsu-build:
  rsu-vendor:
  rsu-db-data:
